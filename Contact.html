<link rel="stylesheet" href="styles-grid.css">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Information</title>
    <div class="contact-information" style="margin-bottom: 5px;">
    <!-- Your contact details go here -->
    <p style="font-size: 40px; font-weight: bold;">Contact Information</p>
    </div>
</head>
<body>
    
    <!-- Grid Container -->
    <div class="grid-container">
        <!-- Grid Items -->
           <!-- Row 1 -->
    <div class="grid-item">Contact Name:</div>
    <div class="grid-item">Jeff Zahn</div>
    
    <!-- Row 2 -->
    <div class="grid-item">Address:</div>
    <div class="grid-item">123 Main Street, Anytown, ST 12345</div>
   
    <!-- Row 3 -->
    <div class="grid-item">Phone Number:</div>
    <div class="grid-item">910-555-0123</div>

    <!-- Row 4 -->
    <div class="grid-item">Email:</div>
    <div class="grid-item">jeff.zahn@example.com</div>
   
  
    </div>

    <form method="post" action="https://miswebapps.uncw.edu/mis310/form-submit.aspx">

    <!-- Your form controls go here -->

    <div>
    <label for="name">Name:</label>
    <input type="text" id="name" name="Name" required />
  </div>
  <div>
    <label for="email">Email:</label>
    <input type="email" id="email" name="Email" required />
  </div>
  <div>
    <label for="message">Message:</label>
    <textarea id="message" name="Message" required></textarea>
  </div>
  <button type="submit">Submit</button>

</form>

</body>
</html>
