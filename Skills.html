<link rel="stylesheet" href="styles.css">

<!DOCTYPE html>
<html lang="en">
<head>
    <img src="images/images (6).jpg" alt="skills image">
    <meta charset="UTF-8">
    <title>List of Skills</title>
    <style>
        /* Styles the main table container */
        table {
            width: 100%;
            border-collapse: collapse; /* Prevents double borders between cells */
            font-family: Arial, sans-serif;
        }

        /* Adds a crisp border and padding to header and data cells */
        th, td {
            border: 1px solid #111111;
            padding: 10px;
            text-align: left;
        }

        /* Gives the header row a distinct background color */
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <table>
         <caption style="margin-bottom: 20px;">List of Skills</caption>
        <!-- The Header Row (Columns) -->
        <thead>
           <tr>
                <th>Skill</th>
                <th>Years of Experience</th>
                <th>Proficiency Level</th>
            </tr>
        </thead>
        
        <!-- The Body Rows (Data) -->
        <tbody>
            <tr>
                <td>System Designer</td>
                <td>20</td>
                <td>High</td>
            </tr>
            <tr>
                <td>Software Engineer </td>
                <td>20</td>
                <td>High</td>
            </tr>
            <tr>
                <td>Infrastructure Engineer</td>
                <td>15</td>
                <td>High</td>
            </tr>
            <tr>
                <td>Web Developer</td>
                <td>10</td>
                <td>Medium</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
