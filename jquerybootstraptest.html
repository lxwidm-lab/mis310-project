<!DOCTYPE html>
<html lang="en">
<head>

    <script src="https://jquery.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery and Bootstrap Test Page</title>
    <p style="font-size: 40px; font-weight: bold;">jQuery and Bootstrap Test Page</p>
</head>
<body>
    <h2 id="message">Message</h2>
    <div><button class="btn btn-primary">Bootstrap is working</button></div>
    <script>
    $(document).ready(function() {
      // Runs only after the HTML page and jQuery are completely loaded
      console.log("jQuery is loaded and ready!");
     $("#message").text("jQuery is working");
     });
    </script>     
</body>
</html>
